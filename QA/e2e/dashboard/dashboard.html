      <div class="empty">No suite run has written its progress here yet. Start one, and this page follows it:<br><br>${cmd('npm run e2e:dev')}</div>`;
  }

  // ---- Data --------------------------------------------------------------------------------
  async function poll() {
    try {
      const runsRes = await fetch('runs.json', { cache: 'no-store' });
      ui.runs = runsRes.ok ? await runsRes.json() : [];
      if (!ui.runs.length) { noRun(); ui.failedSince = null; return; }
      const id = ui.runId || ui.runs[0].id;
      const res = await fetch(`${encodeURIComponent(id)}/progress.json`, { cache: 'no-store' });
      if (!res.ok) throw new Error(String(res.status));
      ui.data = await res.json();
      ui.fetchedAt = Date.now();
      const date = Date.parse(res.headers.get('Date'));
      ui.serverAt = Number.isFinite(date) ? date : Date.now();
      ui.failedSince = null;
      renderPicker();
    } catch (e) {
      if (!ui.failedSince) ui.failedSince = Date.now();
    }
    render();
  }

  // ---- Controls ----------------------------------------------------------------------------
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    $('theme').textContent = theme === 'dark' ? 'Light' : 'Dark';
    $('theme').setAttribute('aria-label', `Switch to the ${theme === 'dark' ? 'light' : 'dark'} theme`);
  }
  setTheme(store.get('e2e-theme') === 'light' ? 'light' : 'dark');
  $('theme').addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    setTheme(next);
    store.set('e2e-theme', next);
  });

  $('picker').addEventListener('change', (e) => {
    const id = e.target.value;
    const newest = ui.runs[0] && ui.runs[0].id;
    location.search = id === newest ? '' : `?run=${encodeURIComponent(id)}`;
  });

  function copy(text, button) {
    const done = () => { const was = button.textContent; button.textContent = 'Copied'; setTimeout(() => { button.textContent = was; }, 1200); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => {});
    else {
      const area = document.createElement('textarea');
      area.value = text; document.body.appendChild(area); area.select();
      try { document.execCommand('copy'); done(); } catch (e) { /* nothing to do */ }
      area.remove();
    }
  }

  document.addEventListener('click', (e) => {
    const copyBtn = e.target.closest('[data-copy]');
    if (copyBtn) { copy(copyBtn.dataset.copy, copyBtn); return; }
    const toggle = e.target.closest('[data-toggle]');
    if (toggle) {
      const id = toggle.dataset.toggle;
      const running = ui.data && (ui.data.jobs || []).find((j) => j.status === 'running');
      const openNow = ui.userOpened ? ui.open : (running && running.id);
      ui.userOpened = true;
      ui.open = openNow === id ? '' : id;
      render();
      return;
    }
    const jobLink = e.target.closest('[data-job]');
    if (jobLink && jobLink.dataset.job) {
      ui.userOpened = true; ui.open = jobLink.dataset.job;
      render();
      e.preventDefault();
      $('table').scrollIntoView({ behavior: 'smooth', block: 'start' });
      return;
    }
    const res = e.target.closest('[data-result]');
    if (res) { ui.result = res.dataset.result; render(); }
  });
  $('copy-summary').addEventListener('click', (e) => copy($('summary-text').textContent, e.target));
  ['search', 'f-tag', 'f-facade', 'f-wallet', 'log-job', 'log-kind'].forEach((id) => $(id).addEventListener('input', render));
  $('jump').addEventListener('click', () => { $('log-list').scrollTop = 0; ui.newLines = false; render(); });
  $('log-list').addEventListener('scroll', () => { if ($('log-list').scrollTop <= 4 && ui.newLines) { ui.newLines = false; $('jump').classList.add('hidden'); } });

  document.addEventListener('keydown', (e) => {
    const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement && document.activeElement.tagName);
    if (e.key === 'Escape' && document.activeElement === $('search')) { $('search').value = ''; $('search').blur(); render(); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === '/') { e.preventDefault(); $('search').focus(); }
    if (e.key === 'f') {
      const target = $('failures').classList.contains('hidden') ? $('results') : $('failures');
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      if (target.hasAttribute('tabindex')) target.focus({ preventScroll: true });
    }
  });

  poll();
  setInterval(poll, POLL_MS);
  // The "updated" line and every "ago" move between polls too.
  setInterval(renderUpdated, 1000);
})();
</script>
</body>
</html>
