  The live dashboard of an e2e suite run (QA/e2e/README.md "Watching a run live"). One file, no
  request but to its own server: it reads progress.json every 2 s and starts nothing. The design is
  in QA/e2e/design/dashboard/ (tokens, components, the state-1 screens); the colours below are its
  tokens.css. Everything shown comes from progress.json, and a missing field hides its element.
-->
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>e2e run</title>
<link rel="icon" id="favicon" href="data:,">
<style>
:root, [data-theme="dark"] {
  --surface-0: #0f1115; --surface-1: #151922; --surface-2: #1a1f2a; --surface-3: #202633;
  --line: #262c38; --line-soft: #20252f; --line-strong: #3a4252;
  --ink: #e6e8ec; --ink-soft: #c9cfd8; --ink-dim: #8d96a6; --ink-faint: #4b5466;
  --link: #8cbcff; --info-bg: #1f2a3a; --info-line: #3d5a80;
  --run: #5fd4c4; --run-bg: #12302c; --run-line: #2a5a54; --run-row: #13231f;
  --pass: #7ad69a; --pass-fill: #3f7f62;
  --fail: #ff6b7a; --fail-bg: #3a1a20;
  --needs: #ffd27a; --needs-bg: #2e2614;
  --finding: #c4b5ff; --finding-bg: #1b1828; --finding-line: #4a3d6b;
  --estimate-line: #6b7486; --hatch: #8d96a6;
  color-scheme: dark;
}
[data-theme="light"] {
  --surface-0: #f5f6f8; --surface-1: #ffffff; --surface-2: #eef1f5; --surface-3: #e3e7ee;
  --line: #dde1e8; --line-soft: #e9ecf1; --line-strong: #c3cad5;
  --ink: #161a21; --ink-soft: #2e3542; --ink-dim: #5a6372; --ink-faint: #a3abb8;
  --link: #1f5fbf; --info-bg: #e4eefc; --info-line: #9bb8e6;
  --run: #0e7c6e; --run-bg: #dff4f0; --run-line: #9ad8cd; --run-row: #eef9f6;
  --pass: #1f7a45; --pass-fill: #8fd0ab;
  --fail: #c0263a; --fail-bg: #fde6e9;
  --needs: #8a5a00; --needs-bg: #fff4d6;
  --finding: #5b3fc4; --finding-bg: #f1edff; --finding-line: #cfc3f5;
  --estimate-line: #8a93a3; --hatch: #5a6372;
  color-scheme: light;
}
:root {
  --font-sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --radius-xs: 2px; --radius-sm: 6px; --radius-md: 10px; --radius-lg: 12px; --radius-pill: 999px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--ink); font: 14px/1.45 var(--font-sans); font-variant-numeric: tabular-nums; }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.mono { font-family: var(--font-mono); }
.dim { color: var(--ink-dim); }
.soft { color: var(--ink-soft); }
.hidden { display: none !important; }
.sr { position: absolute; left: -9999px; }
.hatch { background: repeating-linear-gradient(135deg, var(--hatch) 0 2px, transparent 2px 5px); }
kbd { font: 11px var(--font-mono); border: 1px solid var(--line-strong); border-radius: 4px; padding: 0 5px; color: var(--ink-dim); }

.page { max-width: 1440px; margin: 0 auto; padding: 28px 56px 56px; display: flex; flex-direction: column; gap: 20px; }
.panel { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
.figure-xl { font-size: 34px; line-height: 40px; font-weight: 600; letter-spacing: -.02em; }
.figure-m { font-size: 20px; line-height: 26px; font-weight: 600; }
.figure-s { font-size: 16px; font-weight: 500; color: var(--ink); }
.btn { background: var(--surface-1); color: var(--ink); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 10px; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--line-strong); }
.stale .live-figure { opacity: .45; }

/* Header */
header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.top-left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.top-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.top h1 { margin: 0 0 0 4px; font-size: 20px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
.meta { font: 12px var(--font-mono); color: var(--ink-dim); display: flex; gap: 16px; flex-wrap: wrap; }
.top-right { display: flex; align-items: center; gap: 12px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end; }
.updated { font-size: 12px; color: var(--ink-dim); display: inline-flex; align-items: center; gap: 6px; }
.updated .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--run); }
.updated.late .dot { background: transparent; box-shadow: inset 0 0 0 1.5px var(--needs); }
.updated.late { color: var(--needs); }
.picker { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-dim); }
.picker select { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 8px; font-size: 13px; max-width: 260px; }
.chip { padding: 3px 9px; border-radius: var(--radius-pill); border: 1px solid var(--line-strong); font-size: 12px; color: var(--ink-dim); white-space: nowrap; }
.chip.mode { color: var(--ink); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

/* StatusPill */
.pill { display: inline-flex; align-items: center; gap: 7px; padding: 3px 11px 3px 9px; border-radius: var(--radius-pill); font-weight: 600; font-size: 13px; line-height: 1.4; white-space: nowrap; }
.pill .pd { width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.running { background: var(--run-bg); color: var(--run); }
.pill.paused, .pill.stuck { background: var(--needs-bg); color: var(--needs); box-shadow: inset 0 0 0 1px var(--needs); }
.pill.paused .pd, .pill.stuck .pd { border-radius: 1px; }
.pill.finished { color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill.failed { background: var(--fail-bg); color: var(--fail); }
.pill.starting, .pill.offline { color: var(--ink-dim); box-shadow: inset 0 0 0 1px var(--line-strong); }
.pill.offline .pd { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
@media (prefers-reduced-motion: no-preference) { .pill.running .pd { animation: breathe 2.4s ease-in-out infinite; } }
@keyframes breathe { 50% { opacity: .35; } }

/* Banners: past run, lost data */
#banners:empty, #needs:empty { display: none; }
.banner { border: 1px solid var(--line-strong); border-radius: var(--radius-md); padding: 10px 16px; color: var(--ink-soft); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.banner b { color: var(--ink); }
.banner.lost { border-color: var(--needs); background: var(--needs-bg); color: var(--ink); }
.banner.lost b { color: var(--needs); }

/* Pinned why and corrections */
.pinned { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.pin { background: var(--surface-1); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 16px; display: flex; gap: 12px; }
.pin .eyebrow { padding-top: 2px; flex-shrink: 0; width: 96px; }
.pin.correction { border-color: var(--line-strong); }
.pin.correction .eyebrow { color: var(--ink); }
.pin p { margin: 0; }
.pin .when { color: var(--ink-dim); }

/* Needs you */
.needs-list { display: flex; flex-direction: column; gap: 10px; }
.needs { display: flex; flex-direction: column; gap: 6px; border: 1px solid var(--needs); background: var(--needs-bg); border-radius: var(--radius-md); padding: 12px 16px; }
.needs.fail { border-color: var(--fail); background: var(--fail-bg); }
.needs-head { display: flex; gap: 8px; align-items: baseline; color: var(--needs); font-weight: 600; }
.needs.fail .needs-head { color: var(--fail); }
.needs-what { color: var(--ink); }
.cmd { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--surface-0); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 6px 6px 10px; font: 12px var(--font-mono); color: var(--ink-soft); }
.cmd code { overflow-wrap: anywhere; }
.cmd .btn { padding: 4px 10px; font: 12px var(--font-sans); flex-shrink: 0; }
.quiet { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 10px 16px; border: 1px dashed var(--line-strong); border-radius: var(--radius-md); color: var(--ink-dim); }
.quiet b { color: var(--ink); font-weight: 500; }
.quiet .results-line { display: none; }

/* Row of three */
.row3 { display: grid; grid-template-columns: 1.05fr 1.5fr .85fr; gap: 16px; align-items: stretch; }
.big-line { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sep { border-top: 1px solid var(--line); padding-top: 12px; }
.runbar { position: relative; height: 10px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
.runbar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--run); }
.runbar .brk { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--surface-1); }
.cap { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-dim); margin-top: 6px; }
.cap b { color: var(--ink); font-weight: 600; }
.triplet { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 12px; color: var(--ink-dim); }

.now { flex-direction: row; gap: 18px; }
.now-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.phase { font-size: 12px; color: var(--run); border: 1px solid var(--run-line); border-radius: var(--radius-pill); padding: 1px 8px; white-space: nowrap; }
.phase.setup, .phase.build, .phase.boot, .phase.cleanup, .phase.done { color: var(--ink-dim); border-color: var(--line-strong); }
.phase.paused, .phase.stuck { color: var(--needs); border-color: var(--needs); }
.crumbs { font: 13px var(--font-mono); color: var(--ink-dim); overflow-wrap: anywhere; }
.sid { font-family: var(--font-mono); display: inline-flex; flex-wrap: wrap; color: var(--ink-soft); overflow-wrap: anywhere; }
.sid .d { color: var(--ink-faint); padding: 0 1px; }
.sid .hl { color: var(--link); }
.sid .w { color: var(--ink-dim); }
.now .sid { font-size: 16px; color: var(--ink); }
.kv { display: flex; gap: 10px; align-items: baseline; }
.kv > .k { font-size: 12px; color: var(--ink-dim); flex-shrink: 0; width: 64px; }
.timebar .track { position: relative; height: 6px; border-radius: 3px; background: var(--surface-3); }
.timebar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--run); }
.timebar.over .fill { background: var(--needs); }
.timebar .tick { position: absolute; left: 66.67%; top: -3px; bottom: -3px; width: 1px; background: var(--ink-dim); }
.timebar .cap { margin-top: 5px; }
.timebar.over .cap .x { color: var(--needs); font-weight: 600; }
.shot { margin: 0; width: 112px; flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; }
.shot .slot { width: 112px; aspect-ratio: 9 / 20; border: 1px dashed var(--line-strong); border-radius: 14px; display: flex; align-items: center; justify-content: center; text-align: center; color: var(--ink-dim); font-size: 12px; padding: 10px; }
.shot figcaption { font-size: 11px; color: var(--ink-dim); text-align: center; }

.counts { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.counts li { display: flex; justify-content: space-between; }
.counts li.zero { color: var(--ink-dim); }
.counts li.bad { color: var(--fail); font-weight: 600; }
.g-pass { color: var(--pass); } .g-fail { color: var(--fail); } .g-run { color: var(--run); } .g-dim { color: var(--ink-dim); } .g-needs { color: var(--needs); }
.results-foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; color: var(--ink-dim); font-size: 13px; }

/* Failures */
.panel.failures { border-color: var(--fail); }
.panel.failures > .eyebrow { color: var(--fail); }
.cause { border: 1px solid var(--line); border-radius: var(--radius-md); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.cause-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.cause-head b { color: var(--fail); }
.cause ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
.expected { display: grid; grid-template-columns: 80px minmax(0, 1fr); gap: 2px 10px; font-size: 13px; }
.expected .k { color: var(--ink-dim); font-size: 12px; }

/* Plan timeline */
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-dim); align-items: center; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 18px; height: 8px; border-radius: 2px; display: inline-block; }
.tl { display: flex; flex-direction: column; gap: 3px; position: relative; }
.tl-row { display: grid; grid-template-columns: 180px minmax(0, 1fr) 150px; gap: 12px; align-items: center; min-height: 22px; }
.tl-label { font: 12px var(--font-mono); color: var(--ink-dim); display: flex; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.tl-label.done { color: var(--ink); } .tl-label.running { color: var(--run); } .tl-label.failed { color: var(--fail); }
.tl-track { position: relative; height: 14px; }
.tl-est { position: absolute; top: 0; bottom: 0; border: 1px solid var(--estimate-line); border-radius: 3px; }
.tl-est.guess { border-style: dashed; }
.tl-act { position: absolute; top: 3px; bottom: 3px; border-radius: var(--radius-xs); background: var(--pass-fill); }
.tl-act.running { background: var(--run); } .tl-act.failed { background: var(--fail); }
.tl-setup { position: absolute; top: 3px; bottom: 3px; border-radius: var(--radius-xs); opacity: .9; }
.tl-drift { font: 12px var(--font-mono); color: var(--ink-dim); text-align: right; white-space: nowrap; }
.tl-axis { position: relative; height: 16px; font-size: 11px; color: var(--ink-dim); }
.tl-axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.tl-overlay { position: absolute; top: -4px; bottom: -4px; pointer-events: none; }
.tl-overlay .nowline { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--run); }
.tl-overlay .partline { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--ink-faint); }

/* Scenario table */
.table { padding: 0; gap: 0; overflow: hidden; }
.tbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--line); }
.search { position: relative; display: flex; align-items: center; }
.search input { width: 240px; background: var(--surface-0); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 6px 30px 6px 10px; font-size: 13px; }
.search kbd { position: absolute; right: 8px; }
.fchip { background: transparent; color: var(--ink-dim); border: 1px solid var(--line); border-radius: var(--radius-pill); padding: 4px 10px; font-size: 12px; cursor: pointer; white-space: nowrap; }
.fchip[aria-pressed="true"] { background: var(--info-bg); color: var(--ink); border-color: var(--info-line); }
select.fchip { appearance: none; padding-right: 10px; }
select.fchip.on { background: var(--info-bg); color: var(--ink); border-color: var(--info-line); }
.thead, .trow { display: grid; grid-template-columns: 120px minmax(0, 1fr) 110px 220px 120px; gap: 12px; padding: 7px 20px; align-items: center; }
.thead { font-size: 11px; font-weight: 600; letter-spacing: .06em; color: var(--ink-dim); border-bottom: 1px solid var(--line); text-transform: uppercase; }
.thead .t, .trow .t { text-align: right; }
.trow { border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.trow .t { font: 12px var(--font-mono); color: var(--ink-dim); }
.trow.job { background: var(--surface-2); border-bottom-color: var(--line); cursor: pointer; width: 100%; border-left: 0; border-right: 0; border-top: 0; text-align: left; color: var(--ink); }
.trow.job .jid { font: 500 13px var(--font-mono); }
.trow.job .sub { font-size: 12px; color: var(--ink-dim); margin-left: 8px; }
.trow.group { font-size: 12px; color: var(--ink-dim); padding-top: 5px; padding-bottom: 5px; }
.trow.group .gl { display: inline-flex; align-items: center; gap: 6px; }
.trow.group .sw { width: 14px; border: 1px solid var(--ink-faint); }
.trow.scen .sid { font-size: 12.5px; padding-left: 16px; }
.trow.scen .note { display: block; padding-left: 16px; font-size: 12px; color: var(--ink-dim); overflow-wrap: anywhere; }
.trow.scen.running { background: var(--run-row); }
.trow.scen.failed { background: var(--fail-bg); }
.res { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.res.failed { color: var(--fail); font-weight: 600; }
.res.running { color: var(--run); }
.res.queued, .res.did-not-run, .res.skipped { color: var(--ink-dim); }
.res .try { font-size: 11px; color: var(--needs); border: 1px solid var(--needs); border-radius: var(--radius-pill); padding: 0 5px; }
.tag { display: inline-block; font-size: 11px; line-height: 16px; border: 1px solid var(--line-strong); border-radius: var(--radius-pill); padding: 1px 8px; color: var(--ink-soft); white-space: nowrap; }
.tag.unknown { border-style: dashed; }
.why { font-size: 12px; color: var(--ink-dim); }
.tfoot { padding: 10px 20px; font-size: 12px; color: var(--ink-dim); }

/* Bottom row */
.row-bottom { display: grid; grid-template-columns: 1fr 1fr 1.15fr; gap: 16px; align-items: start; }
.msg { display: flex; flex-direction: column; gap: 4px; padding: 0 2px; }
.msg-head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--ink-dim); }
.msg-kind { font-weight: 600; }
.msg p { margin: 0; color: var(--ink-soft); }
.msg.finding { padding: 12px 14px; border: 1px solid var(--finding-line); border-radius: 8px; background: var(--finding-bg); }
.msg.finding .msg-kind { color: var(--finding); }
.msg.finding p { color: var(--ink); }
.msg.correction .msg-kind { color: var(--ink); }
.msg.correction { padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 8px; }
.msg.correction p { color: var(--ink); }
.covered ul { margin: 0; padding-left: 18px; color: var(--ink-dim); display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.covered p { margin: 0; }
.reasons { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.reasons li { display: flex; justify-content: space-between; gap: 12px; }
.reasons details { font-size: 12px; color: var(--ink-dim); }
.log-tools { display: flex; gap: 6px; }
.log-tools select { background: var(--surface-0); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 3px 6px; font-size: 12px; }
.log-wrap { position: relative; }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; font-size: 12.5px; max-height: 420px; overflow: auto; }
.log li { display: grid; grid-template-columns: 62px 14px minmax(0, 1fr); gap: 8px; padding: 5px 0; border-bottom: 1px solid var(--line-soft); }
.log .lt { font: 12px var(--font-mono); color: var(--ink-dim); }
.log .lx { color: var(--ink-soft); overflow-wrap: anywhere; }
.log .lj { font-family: var(--font-mono); color: var(--ink-dim); }
.jump { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); font-size: 12px; background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: var(--radius-pill); padding: 3px 12px; cursor: pointer; color: var(--ink); }
.summary pre { margin: 0; font: 12px var(--font-mono); color: var(--ink-soft); white-space: pre-wrap; background: var(--surface-0); border: 1px solid var(--line-soft); border-radius: 8px; padding: 12px 14px; }
.head-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.empty { padding: 48px 0; text-align: center; color: var(--ink-dim); }

/* Phone */
@media (max-width: 760px) {
  .page { padding: 14px 16px 40px; gap: 12px; }
  header.top { flex-direction: column; gap: 8px; padding-bottom: 0; border-bottom: 0; }
  .top h1 { margin: 0; font-size: 16px; line-height: 1.3; flex-basis: 100%; }
  .meta { gap: 4px 10px; font-size: 11px; }
  .meta .wide { display: none; }
  .top-right { justify-content: flex-start; width: 100%; flex-wrap: nowrap; gap: 8px; }
  .picker { flex: 1; min-width: 0; }
  .picker-label { display: none; }
  .picker select { max-width: none; width: 100%; padding: 4px 6px; font-size: 12px; }
  .top-right .btn { padding: 4px 8px; font-size: 12px; }
  .updated { white-space: nowrap; font-size: 11px; }
  .panel { padding: 14px; }
  .pinned, .row3, .row-bottom { display: contents; }
  .page > * { order: 50; }
  #hdr { order: 1; } #banners { order: 2; } #needs { order: 3; } #when { order: 4; } #now { order: 5; }
  #failures { order: 6; } #pinned-why { order: 7; } #pinned-corr { order: 8; } #results { order: 9; }
  #plan { order: 10; } #table { order: 11; } #messages { order: 12; } #covered { order: 13; } #log { order: 14; } #summary { order: 15; }
  .quiet { align-items: flex-start; font-size: 13px; }
  .quiet .results-line { display: block; text-align: right; flex-shrink: 0; }
  .quiet .cmdhint { display: none; }
  .figure-xl { font-size: 30px; line-height: 34px; }
  #when .triplet, #when .drift-jobs { display: none; }
  .now { gap: 12px; }
  .now .sid { font-size: 13px; }
  .shot, .shot .slot { width: 64px; }
  .shot .slot { font-size: 10px; padding: 4px; border-radius: 10px; }
  .shot figcaption { display: none; }
  .kv > .k { width: auto; }
  .tl-row { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; }
  .tl-track { grid-column: 1 / -1; height: 9px; }
  .tl-label { font-size: 11px; }
  .tl-drift { font-size: 11px; grid-row: 1; grid-column: 2; }
  .tl-axis-row { display: none; }
  .tl-overlay { display: none; }
  .tl-act, .tl-setup { top: 2px; bottom: 2px; }
  .search input { width: 100%; }
  .search { flex: 1 1 100%; }
  .tbar { padding: 12px 14px; }
  .thead { display: none; }
  .trow { grid-template-columns: minmax(0, 1fr) auto; gap: 3px 8px; padding: 8px 14px; }
  .trow .c-id { grid-column: 1 / -1; }
  .trow .c-tag, .trow .c-why { grid-column: 1 / -1; display: inline; }
  .trow .c-why:empty, .trow .c-tag:empty { display: none; }
  .trow .t { grid-row: 1; grid-column: 2; }
  .trow.scen .sid, .trow.scen .note { padding-left: 0; }
  .trow.group .c-id { padding-left: 0; }
  .expected { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="page" id="page">
  <header class="top" id="hdr">
    <div class="top-left">
      <div class="top-line">
        <span id="pill" class="pill starting" role="status"><span class="pd" aria-hidden="true"></span><span id="pill-text">Loading</span></span>
        <span id="mode" class="chip mode hidden"></span>
        <span id="part" class="chip hidden"></span>
        <h1 id="name">e2e run</h1>
      </div>
      <div class="meta" id="meta"></div>
    </div>
    <div class="top-right">
      <span class="updated" id="updated"><span class="dot" aria-hidden="true"></span><span id="updated-text">Waiting for data</span></span>
      <label class="picker"><span class="picker-label">Run</span> <select id="picker" aria-label="Pick a run"></select></label>
      <button class="btn" id="theme" type="button">Light</button>
    </div>
  </header>
  <div id="banners"></div>
  <section class="pinned hidden" id="pinned" aria-label="Why this run"></section>
  <section id="needs" aria-label="Needs you"></section>
  <div class="row3" id="row3">
    <section class="panel live-figure" id="when" aria-label="When it ends"></section>
    <section class="panel now live-figure" id="now" aria-label="Now"></section>
    <section class="panel live-figure" id="results" aria-label="Results"></section>
  </div>
  <section class="panel failures hidden" id="failures" aria-label="Failures" tabindex="-1"></section>
  <section class="panel" id="plan" aria-label="Plan"></section>
  <section class="panel table" id="table" aria-label="Scenarios">
    <div class="tbar">
      <span class="eyebrow" style="margin-right:6px">Scenarios</span>
      <label class="search"><span class="sr">Search by id</span><input id="search" type="search" placeholder="Search ids" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
      <span id="result-filters" style="display:contents"></span>
      <label class="sr" for="f-tag">Tag</label><select id="f-tag" class="fchip"></select>
      <label class="sr" for="f-facade">Facade</label><select id="f-facade" class="fchip"><option value="">fn + ws</option><option value="fullnode">fn only</option><option value="wallet-service">ws only</option></select>
      <label class="sr" for="f-wallet">Wallet</label><select id="f-wallet" class="fchip"><option value="">All wallets</option><option>unlocked</option><option>locked</option><option>broken-key</option></select>
    </div>
    <div class="thead" aria-hidden="true"><span>Result</span><span>Scenario</span><span>Tag</span><span>Why it's in</span><span class="t">Time / est</span></div>
    <div id="rows"></div>
    <div class="tfoot" id="tfoot"></div>
  </section>
  <div class="row-bottom">
    <section class="panel" id="messages" aria-label="Messages from the agent"></section>
    <section class="panel covered" id="covered" aria-label="Not covered"></section>
    <section class="panel" id="log" aria-label="Log">
      <div class="head-line">
        <span class="eyebrow">Log · newest first</span>
        <div class="log-tools">
          <select id="log-job" aria-label="Filter the log by job"></select>
          <select id="log-kind" aria-label="Filter the log by kind"></select>
        </div>
      </div>
      <div class="log-wrap">
        <button class="jump hidden" id="jump" type="button">New lines · jump to latest</button>
        <ol class="log" id="log-list"></ol>
      </div>
    </section>
  </div>
  <section class="panel summary" id="summary" aria-label="Summary for the PR">
    <div class="head-line"><span class="eyebrow" id="summary-title">Summary for the PR</span><button class="btn" id="copy-summary" type="button">Copy</button></div>
    <pre id="summary-text"></pre>
  </section>
</div>
<script>
'use strict';
(() => {
  // How often the page reads progress.json, and when the data counts as late.
  const POLL_MS = 2000;
  const LATE_MS = 15000;
  // How far an estimate may be off, as a share of it: measured last time, or a guess.
  const SPREAD = { 'last run': 0.15, mixed: 0.3, guess: 0.4, setup: 0.2 };
  const WALLETS = ['unlocked', 'locked', 'broken-key'];
  const RESULTS = ['failed', 'running', 'passed', 'queued', 'did not run', 'skipped'];
  const GLYPH = { passed: '✓', failed: '✕', running: '▶', queued: '○', 'did not run': '–', skipped: '⊘' };
  const GLYPH_CLASS = { passed: 'g-pass', failed: 'g-fail', running: 'g-run' };
  const EVENT_GLYPH = {
    'job-started': ['▶', 'g-run'], 'job-finished': ['■', 'g-dim'], 'setup-started': ['◐', 'g-dim'], 'setup-finished': ['◐', 'g-dim'],
    'scenario-started': ['▶', 'g-run'], 'scenario-not-run': ['–', 'g-dim'], phase: ['◐', 'g-dim'], 'part-started': ['▶', 'g-run'],
    'part-ended': ['!', 'g-needs'], 'run-finished': ['■', 'g-dim'], message: ['◆', 'g-dim'],
  };
  const KIND = { why: 'Why', note: 'Note', finding: '◆ Finding · suspected app bug', correction: '↺ Correction' };
  const PHASE = {
    build: '◐ building', boot: '◐ starting up', setup: '◐ wallet setup', scenario: '▶ scenario', cleanup: '◐ cleanup', paused: '‖ paused', done: '■ done', stopped: '■ stopped',
  };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(key) { try { return localStorage.getItem(key); } catch (e) { return null; } },
    set(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private window */ } },
  };
  const t = (iso) => (iso ? Date.parse(iso) : NaN);
  const pad = (n) => String(n).padStart(2, '0');
  const clock = (ms) => { const d = new Date(ms); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
  const clockS = (ms) => { const d = new Date(ms); return `${clock(ms)}:${pad(d.getSeconds())}`; };
  /** m:ss, or h:mm:ss past an hour. */
  function dur(sec) {
    const s = Math.max(0, Math.round(sec));
    const h = Math.floor(s / 3600); const m = Math.floor((s % 3600) / 60); const r = s % 60;
    return h ? `${h}:${pad(m)}:${pad(r)}` : `${m}:${pad(r)}`;
  }
  /** "40 min", "1 h 12 min", "35 s". */
  function words(sec) {
    const s = Math.max(0, Math.round(sec));
    if (s < 90) return `${s} s`;
    const m = Math.round(s / 60);
    return m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? ` ${m % 60} min` : ''}`;
  }
  const signed = (sec) => `${sec < 0 ? '−' : '+'}${dur(Math.abs(sec))}`;
  const short = (id) => String(id || '').split(':').pop();
  const day = (ms) => {
    const d = new Date(ms); const today = new Date();
    const y = new Date(); y.setDate(today.getDate() - 1);
    if (d.toDateString() === today.toDateString()) return 'Today';
    if (d.toDateString() === y.toDateString()) return 'Yesterday';
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  };

  /** A dotted scenario id, its parts made scannable; `hl` are the parts to highlight. */
  function sid(id, hl = []) {
    const parts = short(id).split('.');
    return `<span class="sid" title="${esc(id)}">${parts.map((part, i) => {
      let cls = hl.includes(part) ? 'hl' : '';
      if (!cls && i === parts.length - 1 && WALLETS.includes(part)) cls = 'w';
      return `${i ? '<span class="d" aria-hidden="true">.</span>' : ''}<span class="${cls}">${esc(part)}</span>`;
    }).join('')}</span>`;
  }

  function result(status, retried) {
    const g = retried ? '↻' : (GLYPH[status] || '•');
    const cls = String(status).replace(/\s+/g, '-');
    return `<span class="res ${esc(cls)}"><span class="${GLYPH_CLASS[status] || ''}" aria-hidden="true">${g}</span>${esc(status)}${retried ? ' <span class="try" title="Passed on a second try">try 2</span>' : ''}</span>`;
  }

  function tagChip(tag, tags, count) {
    if (!tag) return '';
    const known = tags && Object.prototype.hasOwnProperty.call(tags, tag);
    const title = (tags && tags[tag]) || 'No legend for this tag yet';
    return `<span class="tag${known ? '' : ' unknown'}" title="${esc(title)}">${esc(tag)}${count != null ? ` ${count}` : ''}</span>`;
  }

  function cmd(command) {
    return `<div class="cmd"><code>${esc(command)}</code><button class="btn" type="button" data-copy="${esc(command)}">Copy</button></div>`;
  }

  // ---- State of the page ----------------------------------------------------------------------
  const params = new URLSearchParams(location.search);
  const ui = {
    runId: params.get('run'),
    runs: [],
    data: null,
    fetchedAt: 0,
    serverAt: 0,
    failedSince: null,
    open: null, // the job opened by hand; null: the running one
    userOpened: false,
    result: '',
    seenEvents: null,
    newLines: false,
  };

  // ---- The model: times, estimates, drift ---------------------------------------------------
  /** Now, on the server's clock. */
  const serverNow = () => ui.serverAt + (Date.now() - ui.fetchedAt);

  function model(p) {
    const run = p.run || {};
    const jobs = p.jobs || [];
    const live = !['finished', 'stopped'].includes(run.state);
    const end = run.finishedAt ? t(run.finishedAt) : (live ? serverNow() : t(run.now));
    const now = Number.isFinite(end) ? end : serverNow();
    const current = p.current || {};
    const scenarios = jobs.flatMap((job) => (job.scenarios || []).map((s) => ({ ...s, job })));

    // Work time leaves out the pauses between parts.
    const parts = run.parts && run.parts.length ? run.parts : [{ startedAt: run.startedAt, endedAt: run.finishedAt }];
    const elapsed = parts.reduce((sum, part) => sum + Math.max(0, ((part.endedAt ? t(part.endedAt) : now) - t(part.startedAt)) / 1000 || 0), 0);

    const spreadOf = (s) => SPREAD[s.estimateFrom] || SPREAD.guess;
    const jobInfo = jobs.map((job) => {
      const list = job.scenarios || [];
      const groups = job.groups || [];
      const started = t(job.started);
      const finished = t(job.finished);
      const actual = Number.isFinite(started) ? ((Number.isFinite(finished) ? finished : now) - started) / 1000 : 0;
      let remaining = 0; let spread = 0; let done = 0;
      if (job.status === 'queued') {
        remaining = job.estimateSeconds || 0;
        spread = list.reduce((sum, s) => sum + s.estimateSeconds * spreadOf(s), 0)
          + groups.reduce((sum, g) => sum + g.setupEstimateSeconds * SPREAD.setup, 0);
      } else if (job.status === 'running') {
        groups.forEach((g) => {
          if (!g.setupStarted) { remaining += g.setupEstimateSeconds; spread += g.setupEstimateSeconds * SPREAD.setup; }
          else if (!g.setupFinished) {
            const in_ = (now - t(g.setupStarted)) / 1000;
            remaining += Math.max(0, g.setupEstimateSeconds - in_);
            spread += g.setupEstimateSeconds * SPREAD.setup;
            done += Math.min(in_, g.setupEstimateSeconds);
          } else done += g.setupEstimateSeconds;
        });
        list.forEach((s) => {
          if (s.status === 'queued') { remaining += s.estimateSeconds; spread += s.estimateSeconds * spreadOf(s); }
          else if (s.status === 'running') {
            const in_ = (now - t(s.started)) / 1000;
            remaining += Math.max(0, s.estimateSeconds - in_);
            spread += s.estimateSeconds * spreadOf(s) * 0.5;
            done += Math.min(in_, s.estimateSeconds);
          } else if (s.status !== 'skipped') done += s.estimateSeconds;
        });
      }
      // Drift: time the job took beyond what its finished work was estimated at.
      let drift = null;
      if (job.status === 'done' || job.status === 'did not finish') drift = actual - (job.estimateSeconds || 0);
      else if (job.status === 'running') drift = actual - done;
      return { job, actual, remaining, spread, drift };
    });
    const remaining = jobInfo.reduce((sum, j) => sum + j.remaining, 0);
    const spread = jobInfo.reduce((sum, j) => sum + j.spread, 0);
    const drift = jobInfo.reduce((sum, j) => sum + (j.drift || 0), 0);
    const firstEstimate = jobs.reduce((sum, job) => sum + (job.estimateSeconds || 0), 0);
    const guessedLeft = jobInfo.filter(({ job }) => job.status === 'queued' && job.estimateFrom === 'guess').reduce((sum, j) => sum + j.remaining, 0);
    const workDone = jobInfo.reduce((sum, j) => sum + j.actual, 0);

    // Parts: which of the jobs left fit before this part's hard stop, and how many parts the rest takes.
    let partEnd = null; let partSpread = 0; const breaks = []; let partsLeft = 0;
    const part = run.part || null;
    if (part && part.minutes && live) {
      const budget = part.minutes * 60;
      let clockAt = now / 1000;
      const stopAt = t(part.endsBy) / 1000;
      // Paused, the part is over: what is left starts the next one.
      let inPart = run.state !== 'paused'; let used = 0; let work = workDone;
      if (!inPart) { breaks.push(work); partsLeft = 1; }
      jobInfo.forEach((j) => {
        if (!j.remaining) return;
        if (j.job.status === 'running' || (inPart && clockAt + j.remaining <= stopAt)) {
          clockAt += j.remaining; partSpread += j.spread; work += j.remaining;
          return;
        }
        if (inPart) { inPart = false; breaks.push(work); partsLeft = 1; used = 0; }
        if (used && used + j.remaining > budget) { breaks.push(work); partsLeft += 1; used = 0; }
        used += j.remaining; work += j.remaining;
      });
      partEnd = clockAt * 1000;
    }

    const failed = scenarios.filter((s) => s.status === 'failed' || s.status === 'did not run');
    const counts = Object.fromEntries(RESULTS.map((r) => [r, scenarios.filter((s) => s.status === r).length]));
    counts.retried = scenarios.filter((s) => s.status === 'passed' && s.firstTry).length;
    const done = scenarios.filter((s) => ['passed', 'failed', 'did not run', 'skipped'].includes(s.status)).length;

    // Stuck: no event for 3 times the longest usual gap, unless a long silence was announced.
    const lastEvent = t(current.lastEventAt);
    const quiet = t(current.quietUntil);
    const silentFor = (serverNow() - lastEvent) / 1000;
    const stuck = run.state === 'running' && live && Number.isFinite(lastEvent)
      && silentFor > (run.stuckAfterSeconds || 720) && !(quiet > serverNow());
    // The runner writes every 2 s; a file that stopped changing means it stopped.
    const runnerAge = serverNow() - t(run.now);
    const silent = live && ['starting', 'running'].includes(run.state) && runnerAge > LATE_MS && !(quiet > serverNow());

    return {
      run, jobs, jobInfo, scenarios, now, elapsed, remaining, spread, drift, firstEstimate, guessedLeft, workDone,
      partEnd, partSpread, breaks, partsLeft, failed, counts, done, stuck, silentFor, silent, runnerAge, live, current,
      pct: elapsed + remaining > 0 ? Math.min(100, Math.round((elapsed / (elapsed + remaining)) * 100)) : 0,
    };
  }

  /** The run's state as the pill says it. */
  function stateOf(m) {
    if (ui.failedSince && Date.now() - ui.failedSince > LATE_MS) return ['offline', 'Offline'];
    if (m.silent) return ['offline', 'No word from the runner'];
    if (m.stuck) return ['stuck', 'Stuck'];
    const s = m.run.state;
    if (s === 'finished') return m.failed.length ? ['failed', 'Finished · failures'] : ['finished', 'Finished · all passed'];
    if (s === 'stopped') return ['failed', 'Stopped'];
    if (s === 'paused') return ['paused', 'Paused'];
    if (s === 'starting') return ['starting', 'Starting'];
    return ['running', 'Running'];
  }

  // ---- Rendering ----------------------------------------------------------------------------
  function renderHeader(p, m, state) {
    const { run } = m;
    $('pill').className = `pill ${state[0]}`;
    $('pill-text').textContent = state[1];
    const mode = $('mode');
    mode.textContent = run.mode || '';
    mode.classList.toggle('hidden', !run.mode);
    const partChip = $('part');
    const partTotal = run.part ? run.part.n + (m.partsLeft || 0) : 0;
    partChip.textContent = run.part ? `Part ${run.part.n}${partTotal > run.part.n ? ` of ${partTotal}` : ''}` : '';
    partChip.classList.toggle('hidden', !run.part);
    $('name').textContent = run.name || run.id || 'e2e run';
    const sel = run.selection;
    const meta = [
      run.commit && `${run.commit}${run.branch ? ` · ${run.branch}` : ''}`,
      run.tree && (run.tree === 'clean' ? '✓ clean tree' : `! ${run.tree}`),
      run.app && `<span class="wide">app ${esc(run.app)}</span>`,
      run.device && `<span class="wide">${esc(run.device)}</span>`,
      run.startedAt && `started ${day(t(run.startedAt)) === 'Today' ? '' : `${day(t(run.startedAt))} `}${clock(t(run.startedAt))}`,
      sel && sel.of != null && `${sel.picked} of ${sel.of} scenarios`,
    ].filter(Boolean);
    $('meta').innerHTML = meta.map((x) => (x.startsWith('<span') ? x : `<span>${esc(x)}</span>`)).join('');
  }

  function renderUpdated() {
    const el = $('updated');
    const late = ui.failedSince || !ui.fetchedAt;
    const age = ui.fetchedAt ? Math.round((Date.now() - ui.fetchedAt) / 1000) : null;
    el.classList.toggle('late', Boolean(ui.failedSince));
    $('updated-text').textContent = age == null ? 'Waiting for data'
      : `${late ? 'No data for' : 'Updated'} ${age < 60 ? `${age} s` : words(age)} ago`;
    document.body.classList.toggle('stale', Boolean(ui.failedSince && Date.now() - ui.failedSince > LATE_MS));
  }

  function renderBanners(m) {
    const out = [];
    const newest = ui.runs[0] && ui.runs[0].id;
    if (ui.runId && newest && ui.runId !== newest) {
      out.push(`<div class="banner"><b>Past run, read-only.</b> What was recorded of it; nothing here is live. <a href="./">Go to the newest run</a></div>`);
    }
    if (ui.failedSince && Date.now() - ui.failedSince > LATE_MS) {
      out.push(`<div class="banner lost"><b>Lost the connection to the data</b> at ${clock(ui.failedSince)}. The numbers below are from then, not now. The page keeps trying.</div>`);
    }
    $('banners').innerHTML = out.join('');
  }

  function renderPinned(p) {
    const msgs = p.messages || [];
    const why = [...msgs].reverse().find((x) => x.kind === 'why');
    const corrections = msgs.filter((x) => x.kind === 'correction').reverse();
    const el = $('pinned');
    const html = [];
    if (why) html.push(`<div class="pin" id="pinned-why"><span class="eyebrow">Why</span><p>${esc(why.text)}</p></div>`);
    corrections.forEach((c, i) => {
      html.push(`<div class="pin correction" ${i ? '' : 'id="pinned-corr"'}><span class="eyebrow">↺ Correction</span><p>${esc(c.text)} <span class="when">· ${clock(t(c.at))}${c.job ? ` · ${esc(c.job)}` : ''}</span></p></div>`);
    });
    el.innerHTML = html.join('');
    el.classList.toggle('hidden', !html.length);
  }

  function renderNeeds(m, state) {
    const { run } = m;
    const cards = [];
    const card = (title, what, command, fail) => cards.push(`<div class="needs${fail ? ' fail' : ''}" role="alert"><div class="needs-head"><span aria-hidden="true">!</span>${esc(title)}</div>${what ? `<div class="needs-what">${what}</div>` : ''}${command ? cmd(command) : ''}</div>`);
    const readOnly = ui.runId && ui.runs[0] && ui.runId !== ui.runs[0].id;
    if (!readOnly) {
      if (m.silent) {
        card(`The runner has not written since ${clockS(t(run.now))}`,
          `${words(m.runnerAge / 1000)} ago; it writes every 2 s, so it may have stopped, and the numbers below are from then. Look at the terminal that ran it; a full run goes on where it stopped.`,
          run.mode === 'full' ? 'npm run e2e:full -- --resume' : null);
      }
      if (m.stuck) {
        card(`Looks stuck since ${clock(t(m.current.lastEventAt))}`,
          `No event for ${words(m.silentFor)}: 3 times the longest usual gap is ${words(m.run.stuckAfterSeconds)}. Look at the emulator's screen; the run goes on by itself if it moves again.`,
          'adb exec-out screencap -p > screen.png');
      }
      if (run.state === 'paused') {
        card(`Part ${run.part ? run.part.n : ''} ended; the rest waits for you to resume it`, `${m.jobs.filter((j) => j.status === 'queued').length} jobs left, about ${words(m.remaining)} of work.`, run.resume);
      }
      m.jobs.filter((j) => j.status === 'did not finish').forEach((j) => card(`${j.id} didn't finish`, 'The runner stopped in it. Fix what stopped it (the terminal says), then resume.', run.resume || null, true));
      const failedJobs = m.jobs.filter((j) => (j.scenarios || []).some((s) => s.status === 'failed' || s.status === 'did not run'));
      if (failedJobs.length) {
        const n = m.failed.length;
        const live = m.live && run.state === 'running';
        const what = `${n} ${n === 1 ? 'scenario' : 'scenarios'} in ${failedJobs.map((j) => esc(j.id)).join(', ')}. ${live ? 'It can wait: the run goes on, and retrying comes after it.' : 'Read them below, then retry.'} <a href="#failures">See the failures</a>`;
        const retry = run.mode === 'full' ? (run.state === 'finished' ? run.resume : null) : `npm run e2e:dev -- --only ${failedJobs.map((j) => j.id).join(',')} --fresh`;
        card(`${failedJobs.length === 1 ? 'A job has' : `${failedJobs.length} jobs have`} failures`, what, live ? null : retry, true);
      }
      if (run.state === 'stopped' && !m.jobs.some((j) => j.status === 'did not finish')) {
        const end = (ui.data.events || []).find((e) => e.type === 'run-finished');
        card('The run stopped', esc(end ? end.text : 'See its terminal.'), run.resume || `npm run e2e:${run.mode || 'dev'}`, true);
      }
    }
    if (cards.length) {
      $('needs').innerHTML = `<div class="needs-list">${cards.join('')}</div>`;
      return;
    }
    let next = '';
    if (run.part && run.part.minutes && m.partEnd && m.live && m.partsLeft) next = `Next time it will: around ${clock(m.partEnd)}, when part ${run.part.n} ends and part ${run.part.n + 1} waits for a resume.`;
    else if (m.live) next = 'The page will say so here if it does.';
    const done = `<span class="results-line"><span class="g-pass" aria-hidden="true">✓</span> ${m.counts.passed} passed<br><span class="dim"><span aria-hidden="true">✕</span> ${m.counts.failed} failed · of ${m.scenarios.length}</span></span>`;
    $('needs').innerHTML = `<div class="quiet"><span><b>Nothing needs you${m.live ? ' now' : ''}.</b> ${esc(next)}</span>${run.resume && m.live ? `<span class="mono cmdhint" style="font-size:12px">${esc(run.resume)}</span>` : ''}${done}</div>`;
  }

  function renderWhen(m) {
    const { run } = m;
    const el = $('when');
    if (!m.live) {
      const took = m.elapsed;
      el.innerHTML = `<div class="eyebrow">When it ended</div>
        <div><div class="big-line"><span class="dim" style="font-size:13px">Ended</span><span class="figure-xl">${run.finishedAt ? clock(t(run.finishedAt)) : '—'}</span></div>
        <div class="dim">took ${dur(took)} of work${run.parts && run.parts.length > 1 ? ` over ${run.parts.length} parts` : ''} · first estimate ${dur(m.firstEstimate)}</div></div>
        ${barHtml(m, 100)}
        ${tripletHtml(m)}
        ${driftJobsHtml(m)}`;
      return;
    }
    if (run.state === 'starting' || !m.jobs.some((j) => j.started)) {
      el.innerHTML = `<div class="eyebrow">When it ends</div>
        <div><div class="big-line"><span class="dim" style="font-size:13px">Ends</span><span class="figure-xl">≈ ${clock(m.now + m.remaining * 1000)}</span></div>
        <div class="dim">in about ${words(m.remaining)} once it starts · between ${clock(m.now + (m.remaining - m.spread) * 1000)} and ${clock(m.now + (m.remaining + m.spread) * 1000)}</div></div>
        <div class="dim" style="font-size:13px">Starting: ${esc((m.current.step && m.current.step.text) || 'getting the privnet, the emulator and the app ready')}. ${guessText(m)}</div>`;
      return;
    }
    const range = (end, spread) => `between ${clock(end - spread * 1000)} and ${clock(end + spread * 1000)}`;
    const endAll = m.now + m.remaining * 1000;
    let top = '';
    let whole = '';
    if (run.state === 'paused') {
      top = `<div><div class="big-line"><span class="dim" style="font-size:13px">Part ${run.part ? run.part.n : ''} ended</span><span class="figure-xl">${run.part && run.part.endedAt ? clock(t(run.part.endedAt)) : '—'}</span></div>
        <div class="dim">waiting for a resume since ${words((m.now - t(run.part && run.part.endedAt)) / 1000)}</div></div>`;
      whole = `<div class="sep"><div class="big-line"><span class="dim" style="font-size:13px">If resumed now</span><span class="figure-m">≈ ${clock(endAll)}</span><span class="dim">${clock(endAll - m.spread * 1000)} – ${clock(endAll + m.spread * 1000)}</span></div>
        <div class="dim" style="font-size:13px">${words(m.remaining)} of work left. ${guessText(m)}</div></div>`;
    } else if (m.partEnd && m.partsLeft) {
      top = `<div><div class="big-line"><span class="dim" style="font-size:13px">Part ${run.part.n} ends</span><span class="figure-xl">≈ ${clock(m.partEnd)}</span></div>
        <div class="dim">in ${words((m.partEnd - m.now) / 1000)} · ${range(m.partEnd, m.partSpread)}${run.part.endsBy ? ` · hard stop ${clock(t(run.part.endsBy))}` : ''}</div></div>`;
      whole = `<div class="sep"><div class="big-line"><span class="dim" style="font-size:13px">Whole run</span><span class="figure-m">≈ ${clock(endAll)}</span><span class="dim">${clock(endAll - m.spread * 1000)} – ${clock(endAll + m.spread * 1000)}</span></div>
        <div class="dim" style="font-size:13px">${words(m.remaining)} of work left, if ${m.partsLeft === 1 ? `part ${run.part.n + 1} is` : `parts ${run.part.n + 1} to ${run.part.n + m.partsLeft} are`} resumed at once. ${guessText(m)}</div></div>`;
    } else {
      top = `<div><div class="big-line"><span class="dim" style="font-size:13px">Ends</span><span class="figure-xl">≈ ${clock(endAll)}</span></div>
        <div class="dim">in ${words(m.remaining)} · ${range(endAll, m.spread)}</div></div>`;
      const g = guessText(m);
      if (g) whole = `<div class="dim" style="font-size:13px">${g}</div>`;
    }
    el.innerHTML = `<div class="eyebrow">When it ends</div>${top}${whole}${barHtml(m, m.pct)}${tripletHtml(m)}${driftJobsHtml(m)}`;
  }

  function guessText(m) {
    if (!m.remaining) return '';
    const share = m.guessedLeft / m.remaining;
    if (share > 0.9) return 'All of it is guessed, so the range is wide.';
    if (share > 0.4) return `${share > 0.6 ? 'Most' : 'Half'} of it is guessed, so the range is wide.`;
    if (share > 0.1) return 'Some of it is guessed.';
    return '';
  }

  function barHtml(m, pct) {
    const total = m.workDone + m.remaining;
    const brks = total ? m.breaks.map((b) => `<div class="brk" style="left:${(b / total) * 100}%"></div>`).join('') : '';
    const partsCap = m.run.part && m.breaks.length ? Array.from({ length: m.breaks.length + 1 }, (_, i) => `part ${m.run.part.n + i}`).join(' · ') : '';
    return `<div><div class="runbar" role="img" aria-label="${pct} percent done by time"><div class="fill" style="width:${pct}%"></div>${brks}</div>
      <div class="cap"><span><b>${pct}%</b> by time</span><span>${esc(partsCap)}</span></div></div>`;
  }

  function tripletHtml(m) {
    const ahead = m.drift < 0;
    return `<div class="triplet"><div>Elapsed<div class="figure-s">${dur(m.elapsed)}</div></div>
      <div>Left<div class="figure-s">${m.live ? dur(m.remaining) : '—'}</div></div>
      <div>Drift<div class="figure-s">${Math.abs(m.drift) < 1 ? '0:00' : signed(m.drift)} <span class="dim" style="font-size:12px;font-weight:400">${Math.abs(m.drift) < 1 ? 'on time' : (ahead ? 'ahead' : 'behind')}</span></div></div></div>`;
  }

  function driftJobsHtml(m) {
    const causes = m.jobInfo.filter((j) => j.drift != null && Math.abs(j.drift) >= 30)
      .sort((a, b) => Math.abs(b.drift) - Math.abs(a.drift)).slice(0, 4);
    if (!causes.length) return '';
    return `<div class="mono dim drift-jobs" style="font-size:12px">${causes.map((j) => `${esc(j.job.id)} ${signed(j.drift)}`).join(' · ')}</div>`;
  }

  function nextScenario(m) {
    const job = m.jobs.find((j) => j.id === m.current.job);
    if (job) {
      const queued = (job.scenarios || []).find((s) => s.status === 'queued');
      if (queued) return { s: queued, job };
    }
    const nextJob = m.jobs.find((j) => j.status === 'queued');
    return nextJob ? { job: nextJob } : null;
  }

  function renderNow(m) {
    const el = $('now');
    const c = m.current;
    const job = m.jobs.find((j) => j.id === c.job);
    const scenario = job && (job.scenarios || []).find((s) => s.id === c.scenario);
    let phase = c.phase || (m.live ? 'boot' : 'done');
    if (!m.live) phase = m.run.state === 'stopped' ? 'stopped' : 'done';
    const phaseCls = m.stuck ? 'stuck' : phase;
    const lines = [];
    lines.push(`<div class="head-line"><span class="eyebrow">Now</span><span class="phase ${esc(phaseCls)}">${esc(m.stuck ? '! stuck' : (PHASE[phase] || phase))}</span></div>`);
    if (!m.live || m.run.state === 'paused') {
      const last = (ui.data.events || [])[0];
      lines.push(`<div class="soft">${m.run.state === 'paused' ? 'Nothing runs until the resume.' : `Nothing runs: the run ${m.run.state === 'stopped' ? 'stopped' : 'ended'}${m.run.finishedAt ? ` at ${clock(t(m.run.finishedAt))}` : ''}.`}</div>`);
      if (last) lines.push(`<div class="dim" style="font-size:13px">Last: <span class="mono">${esc(last.job || '')}</span> ${esc(last.text)}</div>`);
      const nx = m.run.state === 'paused' && nextScenario(m);
      if (nx) lines.push(`<div class="dim sep" style="font-size:13px">Next <span class="mono soft">${esc(nx.job.id)}</span> · ~${words(nx.job.estimateSeconds)}</div>`);
      el.innerHTML = `<div class="now-main">${lines.join('')}</div>`;
      return;
    }
    if (job) {
      const groups = job.groups || [];
      const gi = groups.findIndex((g) => g.wallet === c.wallet);
      const inGroup = (job.scenarios || []).filter((s) => s.wallet === c.wallet);
      const k = scenario ? inGroup.indexOf(scenario) + 1 : 0;
      lines.push(`<div class="crumbs">${esc(job.id)}${c.wallet ? ` <span aria-hidden="true">›</span> ${esc(c.wallet)} wallet${groups.length > 1 && gi >= 0 ? ` <span>(group ${gi + 1} of ${groups.length})</span>` : ''}` : ''}${k ? ` <span aria-hidden="true">›</span> ${k} of ${inGroup.length}` : ''}</div>`);
    }
    let elapsed = (m.now - t(c.startedAt)) / 1000;
    let expected = null;
    if (scenario) {
      const prev = (job.scenarios || [])[(job.scenarios || []).indexOf(scenario) - 1];
      const prevParts = prev ? short(prev.id).split('.') : [];
      const hl = prev ? short(scenario.id).split('.').filter((part, i) => prevParts[i] !== part && !WALLETS.includes(part)) : [];
      lines.push(`<div>${sid(scenario.id, hl)}</div>`);
      expected = scenario.estimateSeconds;
      elapsed = (m.now - t(scenario.started)) / 1000;
    } else if (phase === 'setup' && job) {
      const g = (job.groups || []).find((x) => x.wallet === c.wallet);
      if (g && g.setupStarted && !g.setupFinished) {
        lines.push(`<div class="soft">Setting up the ${esc(g.wallet)} wallet for ${g.scenarios} scenarios: work, with no result until it ends.</div>`);
        expected = g.setupEstimateSeconds;
        elapsed = (m.now - t(g.setupStarted)) / 1000;
      } else lines.push('<div class="soft">Between scenarios.</div>');
    } else if (phase === 'build' || phase === 'boot') {
      lines.push(`<div class="soft">No scenario yet: getting the privnet, the emulator and the app ready.</div>`);
      if (c.expectedSeconds) expected = c.expectedSeconds;
    }
    if (c.step && c.step.text) lines.push(`<div class="kv"><span class="k">Step</span><span>${esc(c.step.text)}</span></div>`);
    if (scenario && (scenario.expectsText || scenario.expects)) {
      lines.push(`<div class="kv"><span class="k">Expects</span><span class="soft">${scenario.expectsText ? `“${esc(scenario.expectsText)}”` : ''} <span class="mono dim" style="font-size:12px">${esc(scenario.expects || '')}</span></span></div>`);
    }
    if (expected) {
      const ratio = elapsed / expected;
      const over = ratio > 1;
      lines.push(`<div class="timebar${over ? ' over' : ''}"><div class="track" role="img" aria-label="${dur(elapsed)} of ${dur(expected)} expected"><div class="fill" style="width:${Math.min(ratio / 1.5, 1) * 100}%"></div><div class="tick"></div></div>
        <div class="cap"><span><b style="font-weight:400;color:var(--ink)">${dur(elapsed)}</b> of ${dur(expected)} expected${over ? ` · <span class="x">${(Math.round(ratio * 10) / 10)}×</span>` : ''}</span><span>${m.stuck ? `no event since ${clock(t(c.lastEventAt))}` : ''}</span></div></div>`);
    } else if (Number.isFinite(elapsed)) {
      lines.push(`<div class="dim" style="font-size:12px">${dur(elapsed)} in this phase</div>`);
    }
    const nx = nextScenario(m);
    if (nx) {
      lines.push(`<div class="dim sep" style="font-size:13px">Next ${nx.s ? `<span class="mono soft">${esc(short(nx.s.id))}</span> · ~${dur(nx.s.estimateSeconds)}` : `<span class="mono soft">${esc(nx.job.id)}</span> · ~${words(nx.job.estimateSeconds)}`}</div>`);
    }
    el.innerHTML = `<div class="now-main">${lines.join('')}</div>
      <figure class="shot"><div class="slot">No screen: not captured live</div><figcaption>phone screen</figcaption></figure>`;
  }

  function renderResults(m) {
    const c = m.counts;
    const li = (glyph, cls, label, n, bad) => `<li class="${bad && n ? 'bad' : (n ? '' : 'zero')}"><span><span class="${cls}" aria-hidden="true">${glyph}</span> ${label}</span><span>${n}</span></li>`;
    const rows = [
      li('✓', 'g-pass', 'passed', c.passed - c.retried),
      li('↻', 'g-pass', 'passed on a retry', c.retried),
      li('✕', c.failed ? 'g-fail' : 'g-dim', 'failed', c.failed, true),
      c['did not run'] ? li('–', 'g-fail', 'did not run', c['did not run'], true) : '',
      li('▶', 'g-run', 'running', c.running),
      li('○', 'g-dim', 'queued', c.queued),
      c.skipped ? li('⊘', 'g-dim', 'skipped', c.skipped) : '',
    ].join('');
    const foot = m.failed.length
      ? `<span class="g-fail">${m.failed.length} need a look.</span> <a href="#failures">See them</a>, or press <kbd>f</kbd>.`
      : 'No failures. Press <kbd>f</kbd> to jump to them when there are.';
    $('results').innerHTML = `<div class="eyebrow">Results</div>
      <div><span class="figure-xl">${m.done}</span><span class="dim"> of ${m.scenarios.length} done</span></div>
      <ul class="counts">${rows}</ul><div class="results-foot">${foot}</div>`;
  }

  /** Failures that look like one cause: a broken setup, or the same note within a job. */
  function causes(m) {
    const groups = new Map();
    m.failed.forEach((s) => {
      const g = (s.job.groups || []).find((x) => x.wallet === s.wallet);
      let key; let title;
      if (s.status === 'did not run' || (g && g.setupError)) {
        key = `${s.job.id} setup ${s.wallet}`;
        title = `The ${s.wallet} wallet's setup broke in ${s.job.id}`;
      } else {
        const note = String(s.note || '').replace(/\d+(\.\d+)?/g, '#');
        key = `${s.job.id} ${note}`;
        title = `${s.job.id}`;
      }
      if (!groups.has(key)) groups.set(key, { key, title, setup: g && g.setupError, list: [] });
      groups.get(key).list.push(s);
    });
    return [...groups.values()];
  }

  function renderFailures(m) {
    const el = $('failures');
    if (!m.failed.length) { el.classList.add('hidden'); el.innerHTML = ''; return; }
    el.classList.remove('hidden');
    const cs = causes(m);
    const html = cs.map((c) => {
      const one = c.list.length > 1;
      const first = c.list[0];
      const viewer = first.job.viewer ? `<a href="../${esc(first.job.viewer)}" target="_blank" rel="noopener">recording ↗</a>` : '';
      const head = c.setup
        ? `<div class="cause-head"><span><b>${esc(c.title)}</b> · ${c.list.length} ${c.list.length === 1 ? 'scenario' : 'scenarios'} did not run: one problem</span>${viewer}</div>
           <div class="soft">${esc(c.setup)}</div>`
        : `<div class="cause-head"><span><b>${esc(c.title)}</b> · ${c.list.length} ${one ? 'failures with the same note: likely one cause' : 'failure'}</span>${viewer}</div>`;
      const items = c.setup
        ? `<details><summary class="dim" style="font-size:12px">The ${c.list.length} scenarios</summary><ul>${c.list.map((s) => `<li>${sid(s.id)}</li>`).join('')}</ul></details>`
        : `<ul>${c.list.map((s) => `<li>${sid(s.id)}<div class="expected"><span class="k">Expected</span><span>${esc(s.expectsText || s.expects || '—')}</span><span class="k">Got</span><span>${esc(s.note || '—')}</span></div></li>`).join('')}</ul>`;
      return `<div class="cause">${head}${items}</div>`;
    }).join('');
    el.innerHTML = `<div class="eyebrow">Failures · ${m.failed.length} in ${cs.length} ${cs.length === 1 ? 'cause' : 'causes'}</div>${html}
      <div class="dim" style="font-size:12px">Screenshots and Maestro's logs are in the job's evidence dir on the runner's machine (failure.png beside the scenario), not served here.</div>`;
  }

  function renderPlan(m) {
    const el = $('plan');
    const jobs = m.jobInfo;
    if (!jobs.length) { el.innerHTML = '<div class="eyebrow">Plan</div><div class="dim">No jobs.</div>'; return; }
    const ahead = m.workDone + m.remaining;
    const span = Math.max(m.firstEstimate, ahead, 1);
    const stepS = span > 5400 ? 1800 : span > 1800 ? 600 : span > 600 ? 120 : 60;
    const axis = Math.ceil(span / stepS) * stepS;
    const x = (sec) => `${Math.max(0, Math.min(100, (sec / axis) * 100))}%`;
    const w = (sec) => `${Math.max(0.3, (sec / axis) * 100)}%`;
    let estAt = 0; let actAt = 0;
    const rows = jobs.map((j) => {
      const { job } = j;
      const est = job.estimateSeconds || 0;
      const started = Number.isFinite(t(job.started));
      // Bars of jobs not started yet move by the drift so far.
      const estL = started ? estAt : estAt + m.drift;
      estAt += est;
      const status = job.status === 'done' ? ((job.counts && job.counts.failed) ? 'failed' : 'done') : (job.status === 'did not finish' ? 'failed' : job.status);
      let act = '';
      let setups = '';
      if (started) {
        act = `<div class="tl-act ${esc(status)}" style="left:${x(actAt)};width:${w(j.actual)}"></div>`;
        setups = (job.groups || []).filter((g) => g.setupStarted && !g.reused).map((g) => {
          const from = (t(g.setupStarted) - t(job.started)) / 1000;
          const len = ((g.setupFinished ? t(g.setupFinished) : m.now) - t(g.setupStarted)) / 1000;
          return `<div class="tl-setup hatch" style="left:${x(actAt + from)};width:${w(len)}" title="${esc(g.wallet)} wallet setup ${dur(len)}"></div>`;
        }).join('');
        actAt += j.actual;
      }
      const glyph = { done: '✓', running: '▶', failed: '✕', queued: '○' }[status] || '○';
      let drift = '';
      if (job.status === 'done' || job.status === 'did not finish') drift = `${dur(j.actual)} / ${dur(est)}  ${signed(j.drift)}`;
      else if (job.status === 'running') drift = `${dur(j.actual)} / ${dur(est)}`;
      else if (job.estimateFrom === 'guess') drift = 'guess';
      else if (job.estimateFrom === 'mixed') drift = `${job.guessed} of ${(job.scenarios || []).length} guessed`;
      return `<div class="tl-row"><button class="tl-label ${esc(status)}" type="button" data-job="${esc(job.id)}"><span aria-hidden="true" style="width:12px">${glyph}</span>${esc(job.id)}</button>
        <div class="tl-track"><div class="tl-est${job.estimateFrom === 'guess' ? ' guess' : ''}" style="left:${x(estL)};width:${w(est)}"></div>${act}${setups}</div>
        <div class="tl-drift">${esc(drift)}</div></div>`;
    }).join('');
    const ticks = [];
    for (let s = 0; s <= axis; s += stepS) ticks.push(`<span style="left:${x(s)}">${s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor((s % 3600) / 60))}` : `${Math.floor(s / 60)} min`}</span>`);
    const nowAt = m.live ? m.workDone : null;
    const parts = m.breaks.map((b) => `<div class="partline" style="left:${x(b)}"></div>`).join('');
    const partLabels = m.breaks.map((b, i) => `<span style="left:${x(b)}">pause · resume part ${m.run.part.n + i + 1}</span>`).join('');
    el.innerHTML = `<div class="head-line"><span class="eyebrow">Plan · ${jobs.length} ${jobs.length === 1 ? 'job' : 'jobs'} in order</span>
      <div class="legend"><span><span class="sw" style="border:1px solid var(--estimate-line)"></span>estimate</span><span><span class="sw" style="border:1px dashed var(--estimate-line)"></span>a guess</span><span><span class="sw" style="background:var(--pass-fill)"></span>actual</span><span><span class="sw hatch"></span>wallet setup</span>${nowAt != null ? '<span><span class="sw" style="width:2px;background:var(--run)"></span>now</span>' : ''}</div></div>
      <div class="tl-row tl-axis-row"><span></span><div class="tl-axis">${ticks.join('')}</div><span class="tl-drift">vs estimate</span></div>
      <div class="tl" style="position:relative">${rows}
        <div class="tl-row" style="position:absolute;inset:0;pointer-events:none;min-height:0"><span></span><div class="tl-overlay" style="position:relative;height:100%">${parts}${nowAt != null ? `<div class="nowline" style="left:${x(nowAt)}"></div>` : ''}</div><span></span></div>
      </div>
      ${m.breaks.length || nowAt != null ? `<div class="tl-row tl-axis-row"><span></span><div class="tl-axis">${nowAt != null ? `<span style="left:${x(nowAt)};color:var(--run)">now ${clock(m.now)}</span>` : ''}${partLabels}</div><span></span></div>` : ''}
      <div class="dim" style="font-size:12px">Work time from the start; the pauses between parts are not drawn. Estimates of jobs not started yet are shifted by the drift so far.</div>`;
  }

  // The scenario table: a job folds open one at a time; with a filter or a search, the matches.
  function filters() {
    return {
      q: $('search').value.trim().toLowerCase(), result: ui.result, tag: $('f-tag').value, facade: $('f-facade').value, wallet: $('f-wallet').value,
    };
  }
  const filtering = (f) => Boolean(f.q || f.result || f.tag || f.facade || f.wallet);
  function matches(s, f) {
    return (!f.q || s.id.toLowerCase().includes(f.q)) && (!f.result || s.status === f.result) && (!f.tag || s.tag === f.tag)
      && (!f.facade || s.job.facade === f.facade) && (!f.wallet || s.wallet === f.wallet);
  }

  function renderFilters(p, m) {
    const f = filters();
    $('result-filters').innerHTML = [['', 'All results'], ...RESULTS.map((r) => [r, `${GLYPH[r]} ${r} ${m.counts[r]}`])]
      .filter(([r]) => !r || m.counts[r] || r === 'failed' || r === ui.result)
      .map(([r, label]) => `<button class="fchip" type="button" data-result="${esc(r)}" aria-pressed="${f.result === r}">${esc(label)}</button>`).join('');
    const tags = [...new Set(m.scenarios.map((s) => s.tag).filter(Boolean))];
    const sel = $('f-tag');
    const want = ['', ...tags].join('|');
    if (sel.dataset.tags !== want) {
      const value = sel.value;
      sel.innerHTML = `<option value="">Tag: any</option>${tags.map((tag) => `<option value="${esc(tag)}">${esc(tag)} ${m.scenarios.filter((s) => s.tag === tag).length}</option>`).join('')}`;
      sel.value = tags.includes(value) ? value : '';
      sel.dataset.tags = want;
    }
    ['f-tag', 'f-facade', 'f-wallet'].forEach((id) => $(id).classList.toggle('on', Boolean($(id).value)));
  }

  function tagCounts(list) {
    const counts = {};
    list.forEach((s) => { if (s.tag) counts[s.tag] = (counts[s.tag] || 0) + 1; });
    return Object.entries(counts).sort((a, b) => b[1] - a[1]);
  }

  function jobRow(job, list, info, tags, open) {
    const by = (r) => list.filter((s) => s.status === r).length;
    const failed = by('failed') + by('did not run');
    const status = job.status === 'running' ? 'running' : (failed ? 'failed' : (job.status === 'done' ? 'passed' : (job.status === 'did not finish' ? 'failed' : 'queued')));
    const sub = RESULTS.filter((r) => by(r)).map((r) => `${by(r)} ${r}`).join(' · ') + (job.estimateFrom === 'guess' ? ' · estimate is a guess' : '') + (job.tries > 1 ? ` · try ${job.tries}` : '');
    const whyAll = [...new Set(list.flatMap((s) => s.why || []))].slice(0, 2).join('; ');
    const time = job.started ? `${dur(info.actual)} / ${dur(job.estimateSeconds)}` : `— / ${dur(job.estimateSeconds)}`;
    return `<button class="trow job" type="button" data-toggle="${esc(job.id)}" aria-expanded="${open}">
      <span>${result(status)}</span><span class="c-id"><span class="jid">${open ? '▾' : '▸'} ${esc(job.id)}</span><span class="sub">${esc(sub)}</span></span>
      <span class="c-tag">${tagCounts(list).map(([tag, n]) => tagChip(tag, tags, n)).join(' ')}</span><span class="c-why why">${esc(whyAll)}</span><span class="t">${time}</span></button>`;
  }

  function groupRow(job, g, now) {
    let label = 'setup later';
    let time = `— / ${dur(g.setupEstimateSeconds)}`;
    let hatch = '';
    if (g.setupError) { label = 'setup broke'; hatch = 'hatch'; }
    else if (g.reused && g.setupFinished) { label = 'wallet kept'; }
    else if (g.setupFinished) { label = 'setup done'; hatch = 'hatch'; }
    else if (g.setupStarted) { label = 'setting up'; hatch = 'hatch'; }
    else if (job.status === 'running') label = 'setup next';
    if (g.setupStarted) time = `${dur(((g.setupFinished ? t(g.setupFinished) : now) - t(g.setupStarted)) / 1000)} / ${dur(g.setupEstimateSeconds)}`;
    return `<div class="trow group"><span class="gl"><span class="sw ${hatch}" aria-hidden="true"></span>${label}</span><span class="c-id" style="padding-left:16px">${esc(g.wallet)} wallet · ${g.scenarios} ${g.scenarios === 1 ? 'scenario' : 'scenarios'}${g.setupError ? ` · ${esc(g.setupError)}` : ''}</span><span class="c-tag"></span><span class="c-why"></span><span class="t">${time}</span></div>`;
  }

  function scenRow(s, tags, now) {
    const retried = s.status === 'passed' && s.firstTry;
    let time = `— / ${dur(s.estimateSeconds)}`;
    if (s.started) time = `${dur(((s.finished ? t(s.finished) : now) - t(s.started)) / 1000)} / ${dur(s.estimateSeconds)}`;
    const note = s.note && s.status !== 'passed' ? `<span class="note">${esc(s.note)}</span>` : (s.firstTry && s.firstTry.note ? `<span class="note">first try: ${esc(s.firstTry.status)} · ${esc(s.firstTry.note)}</span>` : '');
    const cls = String(s.status).replace(/\s+/g, '-');
    return `<div class="trow scen ${esc(cls)}"><span>${result(s.status, retried)}</span><span class="c-id">${sid(s.id)}${note}</span>
      <span class="c-tag">${tagChip(s.tag, tags)}</span><span class="c-why why">${esc((s.why || []).join('; '))}</span><span class="t" title="${s.estimateFrom ? `estimate from ${esc(s.estimateFrom)}` : ''}">${time}${s.estimateFrom === 'guess' ? '?' : ''}</span></div>`;
  }

  function renderTable(p, m) {
    const f = filters();
    const tags = p.tags || {};
    const out = [];
    let shown = 0;
    const running = m.jobs.find((j) => j.status === 'running');
    const openId = ui.userOpened ? ui.open : (running ? running.id : null);
    m.jobInfo.forEach((info) => {
      const { job } = info;
      const all = m.scenarios.filter((s) => s.job === job);
      const list = filtering(f) ? all.filter((s) => matches(s, f)) : all;
      if (filtering(f) && !list.length) return;
      const open = filtering(f) || openId === job.id;
      out.push(jobRow(job, all, info, tags, open));
      if (!open) return;
      (job.groups || []).forEach((g) => {
        const inGroup = list.filter((s) => s.wallet === g.wallet);
        if (!inGroup.length && filtering(f)) return;
        if (!filtering(f)) out.push(groupRow(job, g, m.now));
        inGroup.forEach((s) => { out.push(scenRow(s, tags, m.now)); shown += 1; });
      });
    });
    $('rows').innerHTML = out.join('') || '<div class="empty">No scenario matches.</div>';
    $('tfoot').textContent = filtering(f)
      ? `${shown} of ${m.scenarios.length} scenarios match`
      : `${m.scenarios.length} scenarios · jobs fold open one at a time; the running job opens by itself`;
  }

  function renderMessages(p) {
    const el = $('messages');
    const msgs = (p.messages || []).filter((x) => x.kind !== 'why' && x.kind !== 'correction').slice().reverse();
    el.innerHTML = `<div class="eyebrow">From the agent</div>${msgs.length ? msgs.map((x) => {
      const known = ['note', 'finding'].includes(x.kind);
      const target = x.scenario || x.job;
      return `<article class="msg ${known ? esc(x.kind) : ''}"><div class="msg-head"><span class="msg-kind">${esc(KIND[x.kind] || x.kind)}</span><span>${clock(t(x.at))}${target ? ` · <a href="#table" data-job="${esc(x.job || '')}">${esc(short(target))}</a>` : ''}</span></div>
        <p>${esc(x.text)}</p>${x.link ? `<a href="${esc(/^https?:\/\//.test(x.link) ? x.link : `#${x.link}`)}" target="_blank" rel="noopener" style="font-size:12px">${esc(x.link)} ↗</a>` : ''}</article>`;
    }).join('') : '<p class="dim" style="margin:0">Nothing yet. The agent says why it started the run above; notes and findings land here.</p>'}`;
  }

  function renderCovered(p, m) {
    const el = $('covered');
    const nc = m.run.notCovered;
    const lines = [];
    const sel = m.run.selection;
    if (!nc) { el.innerHTML = '<div class="eyebrow">Not covered by this run</div><p class="dim">This run did not say.</p>'; return; }
    if (!nc.owed) {
      lines.push(`<p>Nothing owed.${sel && sel.picked === sel.of ? ` All ${sel.of} scenarios are selected${m.run.mode === 'full' ? ', on one commit' : ''}.` : ''}</p>`);
    } else {
      lines.push(`<p><b>${nc.owed} ${nc.owed === 1 ? 'scenario' : 'scenarios'} owed:</b> what changed may reach ${nc.owed === 1 ? 'it' : 'them'}, and this run leaves ${nc.owed === 1 ? 'it' : 'them'} out.${nc.clearedBy ? ` <span class="dim">Cleared by</span> <span class="mono" style="font-size:12px">${esc(nc.clearedBy)}</span>` : ''}</p>`);
      lines.push(`<ul class="reasons">${(nc.byReason || []).map((r) => `<li><details><summary><span class="soft">${esc(r.reason)}</span> <span class="dim">${r.count}</span></summary>${(r.scenarios || []).slice(0, 40).map((x) => `<div class="mono">${esc(x)}</div>`).join('')}${(r.scenarios || []).length > 40 ? `<div>and ${r.scenarios.length - 40} more</div>` : ''}</details></li>`).join('')}</ul>`);
    }
    const notes = [...(nc.notes || [])];
    if (nc.fresh) notes.push(`${nc.fresh} more are left out because they last passed with exactly what is here.`);
    const owedHere = m.scenarios.filter((s) => s.tag === 'owed');
    if (owedHere.length) notes.push(`${owedHere.length} of ${m.scenarios.length} here are tagged owed (${[...new Set(owedHere.map((s) => s.job.id))].slice(0, 3).join(', ')}): they run in this run.`);
    const guessed = m.jobs.filter((j) => j.estimateFrom === 'guess').length;
    if (guessed) notes.push(`Estimates for ${guessed} ${guessed === 1 ? 'job are guesses' : 'jobs are guesses'}; their first real times come from this run.`);
    lines.push(`<ul>${notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul>`);
    el.innerHTML = `<div class="eyebrow">Not covered by this run</div>${lines.join('')}`;
  }

  function renderLog(p) {
    const events = p.events || [];
    const jobSel = $('log-job'); const kindSel = $('log-kind');
    const jobs = (p.jobs || []).map((j) => j.id);
    const kinds = [...new Set(events.map((e) => e.type))].sort();
    const fill = (sel, values, all) => {
      const want = values.join('|');
      if (sel.dataset.v === want) return;
      const v = sel.value;
      sel.innerHTML = `<option value="">${all}</option>${values.map((x) => `<option>${esc(x)}</option>`).join('')}`;
      sel.value = values.includes(v) ? v : '';
      sel.dataset.v = want;
    };
    fill(jobSel, jobs, 'All jobs');
    fill(kindSel, kinds, 'All kinds');
    const list = events.filter((e) => (!jobSel.value || e.job === jobSel.value) && (!kindSel.value || e.type === kindSel.value));
    const ol = $('log-list');
    const scrolled = ol.scrollTop > 4;
    const newest = events[0] && `${events[0].at} ${events[0].text}`;
    if (ui.seenEvents && newest !== ui.seenEvents && scrolled) ui.newLines = true;
    if (!scrolled) ui.newLines = false;
    ui.seenEvents = newest;
    const before = ol.scrollHeight;
    const top = ol.scrollTop;
    ol.innerHTML = list.length ? list.map((e) => {
      const [g, cls] = e.status ? [GLYPH[e.status] || '•', GLYPH_CLASS[e.status] || 'g-dim'] : (EVENT_GLYPH[e.type] || ['•', 'g-dim']);
      return `<li><span class="lt">${clockS(t(e.at))}</span><span class="${cls}" aria-hidden="true">${g}</span><span class="lx">${e.job ? `<span class="lj">${esc(e.job)}</span> ` : ''}${esc(e.text)}</span></li>`;
    }).join('') : '<li><span></span><span></span><span class="dim">Nothing yet.</span></li>';
    // Keep what the reader looks at in place while new lines come in on top.
    if (scrolled) ol.scrollTop = top + (ol.scrollHeight - before);
    $('jump').classList.toggle('hidden', !ui.newLines);
  }

  function summaryText(p, m) {
    const { run } = m;
    const head = `E2E ${run.mode || ''} run · ${run.commit || ''}${run.branch ? ` (${run.branch}${run.tree ? `, ${run.tree}` : ''})` : ''}${run.app ? ` · app ${run.app}` : ''} · ${run.device || 'Android emulator'}`;
    const c = m.counts;
    const status = m.live ? `In progress: ${c.passed} / ${m.scenarios.length} passed, ${c.failed} failed${run.part ? ` · part ${run.part.n}` : ''} · ${words(m.elapsed)} so far`
      : `${run.state === 'stopped' ? 'Stopped' : 'Finished'}: ${c.passed} / ${m.scenarios.length} passed, ${c.failed} failed${c['did not run'] ? `, ${c['did not run']} did not run` : ''}${c.retried ? `, ${c.retried} passed on a retry` : ''} · ${words(m.elapsed)}`;
    const lines = [head, status];
    m.jobs.forEach((j) => {
      if (!j.counts && j.status !== 'did not finish') return;
      lines.push(`  ${j.id}: ${j.counts ? `${j.counts.passed} passed, ${j.counts.failed} failed${j.counts.skipped ? `, ${j.counts.skipped} skipped` : ''}` : 'did not finish'}${j.tries > 1 ? ` (try ${j.tries})` : ''}`);
    });
    const nc = run.notCovered;
    if (nc && nc.owed) lines.push(`Owed, not run: ${nc.owed} (${(nc.byReason || []).slice(0, 4).map((r) => `${r.reason} ${r.count}`).join(', ')}); ${nc.clearedBy || 'a full run'} clears them`);
    (p.messages || []).filter((x) => x.kind === 'finding').forEach((x) => lines.push(`Finding: ${x.text}${x.job ? ` (${x.job})` : ''}`));
    return lines.join('\n');
  }

  function renderSummary(p, m) {
    $('summary-title').textContent = `Summary for the PR${m.live ? ' · so far' : ''}`;
    $('summary-text').textContent = summaryText(p, m);
  }

  /** The tab carries the state and the share done, so it reads from a tab strip. */
  function renderTab(m, state) {
    const glyph = { running: '▶', paused: '‖', stuck: '!', finished: '✓', failed: '✕', starting: '◐', offline: '○' }[state[0]] || '';
    document.title = `${glyph} ${m.live ? `${m.pct}% · ` : ''}${state[1]} · e2e ${m.run.mode || ''}`.trim();
    const color = { running: '#5fd4c4', paused: '#ffd27a', stuck: '#ffd27a', finished: '#7ad69a', failed: '#ff6b7a', starting: '#8d96a6', offline: '#8d96a6' }[state[0]] || '#8d96a6';
    const failed = m.failed.length && state[0] !== 'failed';
    const angle = (Math.min(99.9, m.pct) / 100) * 2 * Math.PI;
    const arc = m.live && m.pct > 0 ? `<path d="M16 16 L16 3 A13 13 0 ${angle > Math.PI ? 1 : 0} 1 ${16 + 13 * Math.sin(angle)} ${16 - 13 * Math.cos(angle)} Z" fill="${color}"/>` : `<circle cx="16" cy="16" r="13" fill="${color}"/>`;
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="#0f1115" stroke="${color}" stroke-width="2"/>${arc}${failed ? '<circle cx="26" cy="6" r="6" fill="#ff6b7a"/>' : ''}</svg>`;
    $('favicon').href = `data:image/svg+xml,${encodeURIComponent(svg)}`;
  }

  function render() {
    renderUpdated();
    const p = ui.data;
    if (!p) return;
    if (!p.run) {
      $('row3').classList.add('hidden');
      return;
    }
    const m = model(p);
    const state = stateOf(m);
    renderHeader(p, m, state);
    renderBanners(m);
    renderPinned(p);
    renderNeeds(m, state);
    renderWhen(m);
    renderNow(m);
    renderResults(m);
    renderFailures(m);
    renderPlan(m);
    renderFilters(p, m);
    renderTable(p, m);
    renderMessages(p);
    renderCovered(p, m);
    renderLog(p);
    renderSummary(p, m);
    renderTab(m, state);
  }

  function renderPicker() {
    const sel = $('picker');
    const current = ui.runId || (ui.runs[0] && ui.runs[0].id);
    sel.innerHTML = ui.runs.map((r, i) => {
      const at = t(r.startedAt);
      const live = i === 0 && !['finished', 'stopped'].includes(r.state);
      return `<option value="${esc(r.id)}">${Number.isFinite(at) ? `${day(at)} ${clock(at)}` : esc(r.id)} · ${esc(r.mode || '')}${live ? ' (live)' : ` · ${esc(r.state || '')}`}</option>`;
    }).join('') || '<option>No runs yet</option>';
    if (current) sel.value = current;
  }

  function noRun() {
    $('page').innerHTML = `<header class="top"><div class="top-left"><div class="top-line"><span class="pill starting"><span class="pd" aria-hidden="true"></span>No run yet</span><h1>e2e runs</h1></div></div></header>
