appId: network.hathor.wallet
---
# The app is on the wallet service: a failed start falls back to the fullnode without a word.
# Settings shows the server it uses at the bottom, and keeps its scroll, so scroll back up after.
- tapOn:
    id: tab-settings
- scrollUntilVisible:
    element: ".*localhost:18300.*"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element: "You are connected to"
    direction: UP
    timeout: 30000
- tapOn:
    id: tab-home
